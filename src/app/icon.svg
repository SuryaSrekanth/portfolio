<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <!--
    Three offset S's, back to front. The mid-range gradient stops are chosen
    so the mark holds up on a white tab strip and a dark one, since there is
    no tile behind it to guarantee contrast.
  -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="18.6" y="17.6" fill="#A855F7" opacity="0.28">S</text>
    <text x="17.3" y="16.8" fill="#8B5CF6" opacity="0.5">S</text>
    <text x="16" y="16" fill="url(#s)">S</text>
  </g>
</svg>
